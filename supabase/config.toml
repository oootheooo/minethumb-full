project_id = "minethumb"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/", "http://localhost:5173/app"]

[storage]
enabled = true

[functions.create-thumbnail-generation]
verify_jwt = true

[functions.reconcile-generations]
verify_jwt = true

[functions.create-checkout-session]
verify_jwt = true

[functions.cancel-subscription]
verify_jwt = true

[functions.stripe-webhook]
verify_jwt = false
